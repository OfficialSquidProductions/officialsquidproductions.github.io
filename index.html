<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tools by Squid Productions: Production Desk, Scenic, Script Call, and Shot Reporter. Visit each tool's website for downloads and information.">
  <meta name="theme-color" content="#ffffff">
  <title>Squid Productions</title>
  <link rel="icon" type="image/png" href="assets/squid-banner.png">
  <link rel="preload" href="assets/pompiere.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 class="visually-hidden">Squid Productions</h1>
    <img class="banner" src="assets/squid-banner.png" width="760" height="427" alt="Squid Productions">
    <nav class="tools" aria-label="Squid Productions tools">
      <a class="tool production-desk" href="https://productiondesk.squidproductions.org/" aria-label="Production Desk — website and downloads">
        <span class="tool-name">Production Desk</span>
        <span class="tool-mark" aria-hidden="true"></span>
      </a>
      <a class="tool scenic" href="https://scenic.squidproductions.org/" aria-label="Scenic — website and downloads">
        <span class="tool-name">Scenic</span>
        <span class="tool-mark" aria-hidden="true"></span>
      </a>
      <a class="tool script-call" href="https://scriptcall.squidproductions.org/" aria-label="Script Call — website and downloads">
        <span class="tool-name">Script Call</span>
        <span class="tool-mark" aria-hidden="true"></span>
      </a>
      <a class="tool shot-reporter" href="https://shotreporter.squidproductions.org/" aria-label="Shot Reporter — website and downloads">
        <span class="tool-name">Shot Reporter</span>
        <span class="tool-mark" aria-hidden="true"></span>
      </a>
    </nav>
  </main>
  <footer>
    <p>© 2026 Squid Productions. "Squid Productions"<br>and the Squid Productions logo are trademarks of Squid Productions. All rights reserved.</p>
  </footer>
</body>
</html>
